    <!-- este es el formulario para crear eeuipo -->
    <div id="form-crear" class="formulario-oculto">
      <h2>Crear Equipo</h2>

      <label>Nombre del equipo</label>
      <input type="text" id="nombre">

      <label>Localidad del equipo</label>
      <input type="text" id="lugar">

      <button class="btn-guardar" id="btn-guardar-equipo">Guardar</button>
    </div>

    <!-- boton para que el administradir edite los equipos-->

    <!-- formilario para editar equipo -->
  <div id="modal-editar" class="modal oculto">

      <h2>Editar equipo</h2>

      <input type="text" id="modal-nombre">

      <label>Localidad del equipo:</label>
      <input type="text" id="modal-lugar">

      <div class="modal-buttons">
        <button id="modal-guardar" class="btn-guardar">Actualizar</button>
        <button id="modal-cancelar" class="btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

     


    <!-- esta es la tarjeta de MI EQUIPO para el entrenador -->

      <!-- formulario para editar equipo -->
<div id="form-editar-tarjeta" class="formulario-oculto2">
