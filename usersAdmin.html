<!-- Contenido del perfil -->
<main class="content">
    <div class="perfil-container">
    <div class="perfil-card">

        <table class="tabla-usuarios">
  <thead>
    <tr>
      <th>#</th>
      <th>Usuario</th>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>Correo</th>
      <th>Rol</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody id="tabla-usuarios-body">
    <!--se cargan los usuario -->
    <!-- tengo dudas de este -->

<!-- modal para editar al usuario -->
<div id="modal-editar" class="modal hidden">
    <div class="modal-content">

      <h2>Editar Usuario</h2>

      <label>Usuario</label>
      <input type="text" id="edit-username">

      <label>Nombre</label>
      <input type="text" id="edit-name">

      <label>Apellidos</label>
      <input type="text" id="edit-apellidos">

      <label>Correo</label>
      <input type="email" id="edit-email">

      <label>Teléfono</label>
      <input type="text" id="edit-telefono">

      <div class="modal-actions">
        <button id="btn-cancelar-editar">Cancelar</button>
        <button id="btn-guardar-editar">Guardar Cambios</button>
      </div>

    </div>
</div>


    </div>
