<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Liga de Fútbol</title>
    <link rel="stylesheet" href="css/inicio.css">
</head>

<body>
    <div class="container">

        <!-- formulario del loguin -->
        <div class="container-form">
            <form class="sign-in" id="form-login">
                <h2>Iniciar Sesión</h2>

                <span>Use su nombre de usuario y contraseña</span>

                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input 
                        id="login-username" 
                        name="username" 
                        type="text" 
                        placeholder="Usuario" 
                        autocomplete="username"
                    >
                </div>

                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input 
                        id="login-password" 
                        name="password"
                        type="password" 
                        placeholder="Contraseña"
                        autocomplete="current-password"
                    >
                </div>


                <button class="button" type="submit">INICIAR SESIÓN</button>

                <!-- boton del viitante -->
                <button class="button" id="btn-visitante" type="button">
                    Entrar como visitante
                </button>
            </form>
        </div>


        <!-- formulario para el registro -->
        <div class="container-form">
            <form class="sign-up" id="form-register">
                <h2>Registrar</h2>
                <span>Use su correo electrónico para registrarse</span>

                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input id="signup-username" name="username" type="text" placeholder="Usuario">
                </div>

                <div class="container-input">
                    <ion-icon name="person-circle-outline"></ion-icon>
                    <input id="signup-name" name="name" type="text" placeholder="Nombre">
                </div>

                <div class="container-input">
                    <ion-icon name="people-outline"></ion-icon>
                    <input id="signup-apellido" name="apellido" type="text" placeholder="Apellido">
                </div>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input id="signup-email" name="email" type="email" placeholder="Email">
                </div>

                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input id="signup-password" name="password" type="password" placeholder="Password">
                </div>

                <div class="container-input">
                    <ion-icon name="ribbon-outline"></ion-icon>
                    <select id="signup-role" name="role">
                        <option value="ARBITRO">Árbitro</option>
                        <option value="ENTRENADOR" selected>Entrenador</option>
                    </select>
                </div>

                <button class="button" type="submit">REGISTRARSE</button>
            </form>
        </div>


        <!-- este el panel de viebvenida -->
        <div class="container-welcome">
            <div class="welcome-sign-up welcome">
                <h3>¡Bienvenido!</h3>
                <p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
                <button class="button" id="btn-sign-up">Registrarse</button>
            </div>

            <div class="welcome-sign-in welcome">
                <h3>¡Hola!</h3>
                <p>Regístrese con sus datos personales para usar todas las funciones del sitio</p>
                <button class="button" id="btn-sign-in">Iniciar Sesión</button>
            </div>
        </div>

    </div>

    <script src="js/inicio.js"></script>
    <script src="js/fetch_login/login.js"></script>
    <script src="js/visitante.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
